<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MR PS STORE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050608;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:url('./mrps-background.png') center/cover no-repeat;z-index:0}
    body:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.08) 45%,rgba(0,0,0,.70) 100%);z-index:1;pointer-events:none}
    .brand{position:fixed;left:24px;top:20px;z-index:3;display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid rgba(218,177,104,.45);background:rgba(4,7,12,.68);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 0 24px rgba(0,132,255,.12)}
    .brand img{width:48px;height:48px;object-fit:cover;border-radius:10px}.brand b{letter-spacing:3px;color:#f1d39b}.brand span{display:block;font-size:10px;letter-spacing:3px;color:#8ed7ff;margin-top:3px}
    #console{position:fixed;z-index:4;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,1050px);max-height:25vh;overflow:auto;padding:14px 18px;border:1px solid rgba(224,181,104,.55);border-radius:12px;background:rgba(2,5,10,.80);box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 22px rgba(0,133,255,.16);backdrop-filter:blur(10px);font:14px/1.45 Consolas,Monaco,monospace;text-shadow:0 1px 2px #000}
    #console div{padding:2px 0} @media(max-width:700px){.brand{left:10px;top:10px}.brand img{width:38px;height:38px}.brand b{font-size:13px}.brand span{font-size:8px}#console{bottom:8px;width:96vw;max-height:30vh;font-size:11px;padding:10px}}
  </style>
</head>
<body>
  <div class="brand"><img src="./mrps-logo.jpeg" alt="MR PS Store"><div><b>MR PS STORE</b><span>MR SHERIF</span></div></div>
  <div id="console"></div>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
